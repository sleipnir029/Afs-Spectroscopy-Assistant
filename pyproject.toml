[project]
name = "afs-assistant"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rakibuzzaman Rahat", email = "52344836+sleipnir029@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dulwich>=0.24",
    "networkx>=3.3",
    "openai>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.10",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[project.scripts]
afs-assist = "afs_assistant.cli:main"
