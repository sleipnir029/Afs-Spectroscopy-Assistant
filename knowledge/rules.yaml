# Generic domain rules for first-pass spectroscopy assessment (our curation, 2026-10-17).
#
# Each rule states one general fact or constraint from the supplied sources. Rules contain no
# customer scenario content. Every `sources[].quote` must appear verbatim (after normalisation)
# on the cited page in knowledge/pages.jsonl; `afs-assist kb check` enforces this.
#
# Fields
#   id           R-<AREA>-<n>
#   statement    the rule in our words
#   effect       exclude      a method/technique/fiber is ruled out when `when` holds
#                require      the target needs a condition; unknown condition -> "unknown", not "fail"
#                warn         a risk to name in the assessment
#                scope_limit  restricts what evidence can support
#                guidance     how to reason / answer
#   when         condition on assessment slots (all keys must match; list = any of)
#   target       what the effect applies to
#   sources      [{doc, page, quote}]
#
# Slot vocabulary used in `when` / `target`
#   method: NIR | MIR | Raman | Fluorescence | UV-Vis
#   technique: transmission | transflection | diffuse_reflection | ATR | raman_probe | fluorescence_probe
#   physical_state: liquid | paste | soft_solid | powder | solid
#   optical_regime: clear | turbid | opaque | opaque_absorbing   (opaque = scattering; opaque_absorbing = dark, little scattering)
#   proposed_fiber: {family, for_method?}   (existing or proposed fiber link; screening slot, not used in `when`)
#   fluorophore: yes | no | unknown        (does the target or a justified indicator fluoresce?)
#   aqueous: yes | no | unknown
#   heterogeneous: yes | no | unknown
#   fiber_family (in `target`): silica | chalcogenide | polycrystalline | hollow_waveguide | fluoride
#   evidence_scope: page scope tags (knowledge/page_scopes.yaml)
#   claim: readiness_process | readiness_clinical | performance_figure | method_gain

rules:

# ---------------------------------------------------------------- geometry / optical regime
- id: R-GEO-1
  statement: NIR transmission (or transflection) is the preferred geometry for transparent or semi-transparent liquids (source example - dairy streams such as skim milk, whey, permeate).
  effect: guidance
  when: {method: NIR, optical_regime: [clear, turbid]}
  target: {technique: [transmission, transflection]}
  sources:
    - {doc: S01, page: 18, quote: "Transmission is the preferred method for transparent or semi-transparent liquids, such as skim milk, whey, or permeate."}

- id: R-GEO-2
  statement: Transmission fails when the sample is too thick, opaque or fat-rich because light cannot penetrate it.
  effect: exclude
  when: {optical_regime: [opaque, opaque_absorbing]}
  target: {technique: transmission}
  sources:
    - {doc: S01, page: 18, quote: "it fails when the milk becomes too \"thick\" or fat-rich, as the light cannot penetrate the sample."}

- id: R-GEO-3
  statement: NIR diffuse reflection suits opaque, concentrated or scattering samples (Table 1 also lists it for powders).
  effect: guidance
  when: {method: NIR, optical_regime: opaque}
  target: {technique: diffuse_reflection}
  sources:
    - {doc: S01, page: 17, quote: "NIR Reflection is primarily used for opaque or highly concentrated dairy products, such as yogurt, butter, or whole milk concentrates."}

- id: R-GEO-4
  statement: Reflection can be less representative for clear liquids.
  effect: warn
  when: {optical_regime: clear}
  target: {technique: diffuse_reflection}
  sources:
    - {doc: S01, page: 18, quote: "reflection can work well in highly scattering environments but can be less representative for clear liquids."}

- id: R-GEO-5
  statement: In the dairy example, a transflection probe can "in some cases" serve both low-fat and high-fat products; for other low/high-scattering streams this is a hypothesis to test.
  effect: guidance
  when: {method: NIR, optical_regime: [clear, turbid, opaque]}
  target: {technique: transflection}
  sources:
    - {doc: S01, page: 18, quote: "In some cases, a Transflection probe can already be a combined solution working well for low-fat and high-fat containing milk products."}

- id: R-GEO-6
  statement: Reflection signals are sensitive to surface characteristics and particle/globule size, so physical variation can mimic composition change; scatter correction is needed.
  effect: warn
  when: {technique: diffuse_reflection}
  target: {risk: physical_variation}
  sources:
    - {doc: S01, page: 17, quote: "the method is sensitive to the surface characteristics and fat globule size."}

- id: R-GEO-7
  statement: In UV-Vis, a transmission signal saturates in high optical density media; a UV-ATR probe with its very short path can measure black or highly scattering fluids.
  effect: guidance
  when: {method: UV-Vis, optical_regime: [opaque, opaque_absorbing, turbid]}
  target: {technique: ATR}
  sources:
    - {doc: S01, page: 16, quote: "transmission setup becomes saturated because the light cannot penetrate the bulk of the sample."}
    - {doc: S01, page: 16, quote: "extremely short path length that enables the measurement of \"black\" or highly scattering fluids without dilution."}

# ---------------------------------------------------------------- MIR / ATR
- id: R-MIR-1
  statement: MIR absorption is strong, so MIR needs very thin samples or ATR; ATR is the usual in-line route, and MIR transflexion fiber probes also exist.
  effect: guidance
  when: {method: MIR}
  target: {technique: ATR}
  sources:
    - {doc: S01, page: 5, quote: "strong absorption in the mid-IR region limits the corresponding spectral method to the analysis of very thin samples (usually less than 50 μm), but it opens up the possibility of using attenuated total reflectance (ATR)"}
    - {doc: S01, page: 11, quote: "Fig.2.2 Mid-IR Transflexion fiber probe"}

- id: R-MIR-2
  statement: ATR requires tight contact; it suits liquids, pastes and soft solids.
  effect: require
  when: {technique: ATR}
  target: {physical_state: [liquid, paste, soft_solid]}
  sources:
    - {doc: S04, page: 4, quote: "suitability of analyzed samples for ATR measurements, which is true for liquid or soft solid samples and their components, allowing a tight contact with the probe head."}
    - {doc: S01, page: 10, quote: "ATR fiber probes (Fig.1) enable the analysis of liquids and solid elastic samples"}
    - {doc: REF, page: 5, quote: "Liquids, pastes and soft solids in contact with the ATR crystal."}

- id: R-MIR-3
  statement: ATR samples only a surface layer a few micrometres deep, so deposits on the crystal and surface representativeness are risks.
  effect: warn
  when: {technique: ATR}
  target: {risk: fouling_surface_layer}
  sources:
    - {doc: S01, page: 13, quote: "typically at a depth of few microns"}
    - {doc: REF, page: 5, quote: "Usable range limited by fiber and crystal; contact, fouling, compatibility."}

- id: R-MIR-4
  statement: The MIR range is 4000-400 cm-1 (2.5-25 µm); MIR spectra have well-defined bands and high selectivity.
  effect: guidance
  when: {method: MIR}
  target: {range: "4000-400 cm-1"}
  sources:
    - {doc: S01, page: 9, quote: "Vibrational spectroscopy in the mid-IR range (4000-400 cm-1) is one of the most informative methods of chemical analysis."}
    - {doc: S01, page: 5, quote: "Mid-IR band spectra contain well-defined peaks (absorption bands), while NIR, UV, and fluorescence spectra contain broad, highly overlapping signals"}

# ---------------------------------------------------------------- NIR
- id: R-NIR-1
  statement: NIR penetrates up to several millimetres, works with glass optics and standard lamps, and suits remote fiber-probe measurement.
  effect: guidance
  when: {method: NIR}
  target: {property: penetration_remote}
  sources:
    - {doc: S01, page: 5, quote: "NIR spectroscopy, with its relatively large penetration depth (up to several millimetres) even into dense solid samples due to low absorption and strong scattering, allows the use of ordinary glass for optics"}
    - {doc: S01, page: 5, quote: "making it ideal for online applications, including remote measurements via fiber optic probes."}

- id: R-NIR-2
  statement: NIR bands are broad and overlapping; quantitative use needs a chemometric calibration.
  effect: warn
  when: {method: NIR}
  target: {risk: calibration_required}
  sources:
    - {doc: S01, page: 10, quote: "The broad absorption bands observed in this region overlap, suggesting the use of chemometrics for quantitative and qualitative analysis of spectral data."}

- id: R-NIR-3
  statement: The nominal NIR range is 780-2500 nm; the usable range depends on the instrument, fiber and probe actually used.
  effect: guidance
  when: {method: NIR}
  target: {range: "780-2500 nm"}
  sources:
    - {doc: S01, page: 10, quote: "NIR spectra (780-2500 nm) contain predominantly overtones and component bands of fundamental vibrations"}
    - {doc: REF, page: 5, quote: "It is not a product specification: actual spectral coverage, fiber length, component ratings, detection limits and accuracy depend on the configuration and the sample."}

- id: R-NIR-4
  statement: NIR may lack sensitivity for trace components (the source cites below 0.1 percent in a bioprocess context).
  effect: warn
  when: {method: NIR}
  target: {risk: trace_sensitivity}
  sources:
    - {doc: S01, page: 16, quote: "may lack the sensitivity to detect trace compounds below 0.1 percent."}

# ---------------------------------------------------------------- Raman
- id: R-RAM-1
  statement: Raman signals are weak and can be swamped by fluorescence; filters and special probe designs help, and fluorescence background must be checked on real samples.
  effect: warn
  when: {method: Raman}
  target: {risk: fluorescence_background}
  sources:
    - {doc: S01, page: 11, quote: "signals, which are several orders of magnitude weaker than IR absorption peaks"}
    - {doc: S01, page: 11, quote: "superposition of luminescence (fluorescence), which has a significantly higher intensity."}

- id: R-RAM-2
  statement: Raman is well suited to aqueous media because water interferes less than in infrared methods.
  effect: guidance
  when: {method: Raman, aqueous: "yes"}
  target: {property: aqueous_compatible}
  sources:
    - {doc: S01, page: 16, quote: "Raman is particularly well-suited for aqueous environments, as it exhibits low absorbance for water molecules compared to infrared methods."}

- id: R-RAM-3
  statement: Report Raman as Raman shift (cm-1) and state the laser excitation wavelength separately.
  effect: guidance
  when: {method: Raman}
  target: {units: raman_shift_and_excitation}
  sources:
    - {doc: S01, page: 11, quote: "The Raman shift is used as the horizontal (spectral) axis in Raman spectroscopy"}

# ---------------------------------------------------------------- fluorescence / UV-Vis
- id: R-FLU-1
  statement: Fluorescence only measures species that fluoresce (or a justified fluorescent indicator); most chemicals do not.
  effect: require
  when: {method: Fluorescence}
  target: {fluorophore: "yes"}
  sources:
    - {doc: S01, page: 5, quote: "However, most chemicals do not exhibit this property."}
    - {doc: S04, page: 4, quote: "it is limited to the samples containing at least one fluorescent component"}
    - {doc: REF, page: 5, quote: "Only a defined fluorescent species or a justified indicator."}

- id: R-FLU-2
  statement: Fluorescence has high sensitivity but low selectivity; it is not a direct measurement of every analyte.
  effect: warn
  when: {method: Fluorescence}
  target: {risk: low_selectivity}
  sources:
    - {doc: REF, page: 5, quote: "High sensitivity, low selectivity; not a direct measurement of every analyte."}

- id: R-FLU-3
  statement: In bioprocesses, fluorescence is used for intrinsic fluorophores such as NADH, tryptophan and riboflavin.
  effect: guidance
  when: {method: Fluorescence}
  target: {analytes: [NADH, tryptophan, riboflavin]}
  sources:
    - {doc: S01, page: 16, quote: "critical cofactors and amino acids like NADH, tryptophan, and riboflavin."}

- id: R-UV-1
  statement: UV-Vis is very sensitive but signals of mixtures overlap strongly, so chemometrics are needed and selectivity is low.
  effect: warn
  when: {method: UV-Vis}
  target: {risk: overlap_low_selectivity}
  sources:
    - {doc: S01, page: 5, quote: "It has very high sensitivity, especially in the UV region (190-360 nm)"}
    - {doc: S01, page: 5, quote: "the strong overlap of spectral signals in UV spectra complicates the analysis of real samples"}

- id: R-UV-2
  statement: Turbidity (optical density) tracks cell density as a biomass proxy, but optical density is not a viable cell count.
  effect: warn
  when: {method: UV-Vis}
  target: {risk: od_not_viability}
  sources:
    - {doc: S01, page: 16, quote: "cell suspension turbidity correlates well with cell density."}
    - {doc: REF, page: 5, quote: "optical density is not a viable cell count."}

# ---------------------------------------------------------------- fibers / links
- id: R-FIB-1
  statement: A fiber must transmit the method's spectral range. Silica fibers end near 2.4 µm, so they cannot carry MIR light; MIR needs chalcogenide (CIR), polycrystalline (PIR) fibers or hollow waveguides.
  effect: exclude
  when: {method: MIR}
  target: {fiber_family: [silica]}
  check: fiber_coverage
  sources:
    - {doc: S02, page: 6, kind: figure_reading, quote: "350 nm Standard VIS-NIR Silica Fibers Al/Cu-coated VIS-NIR Silica Fibers 2400 nm"}
    - {doc: S02, page: 6, kind: figure_reading, quote: "1100 nm Chalcogenide As-S IR Fibers 6500 nm"}
    - {doc: S02, page: 6, kind: figure_reading, quote: "3000 nm Polycrystalline Infrared Fibers 17 µm"}
    - {doc: S01, page: 9, quote: "Vibrational spectroscopy in the mid-IR range (4000-400 cm-1)"}

- id: R-FIB-2
  statement: Long (100-300 m) cables are stated only for low-OH silica fibers. The MIR fiber and hollow-waveguide samples compared on S02 p.9-10 are 1-2 m laboratory lengths. No source states an achievable length for an MIR link, so any MIR link length is an open question for AFS, not a value to assume.
  effect: warn
  when: {method: MIR}
  target: {risk: mir_link_length_unknown}
  sources:
    - {doc: S02, page: 7, quote: "Robust 100-300m cables made with Silica fibers of low OH-content (<0.1ppm OH) enable remote industrial process-control"}
    - {doc: S02, page: 9, quote: "HWG-750-2m PIR 600/700 -2m"}
    - {doc: S02, page: 10, kind: figure_reading, quote: "1 Meter PolyMicro hollow fiber 1mm ID"}
    - {doc: S02, page: 10, kind: figure_reading, quote: "1.25 Meter Silver Halide - straight run"}

- id: R-FIB-3
  statement: Hollow waveguides couple poorly to FTIR spectrometers; PIR fibers couple much better.
  effect: warn
  when: {method: MIR}
  target: {fiber_family: hollow_waveguide}
  sources:
    - {doc: S02, page: 10, quote: "too low NA>0.1 - which results in very poor coupling efficiency with FTIR-spectrometers"}

- id: R-FIB-4
  statement: Metal-coated silica fibers avoid polymer-jacket fluorescence, which matters for Raman and fluorescence.
  effect: guidance
  when: {method: [Raman, Fluorescence]}
  target: {fiber_family: silica}
  sources:
    - {doc: S02, page: 7, quote: "Free of Polymer jacket fluorescence for Raman and Fluo- Spectroscopy"}

- id: R-FIB-5
  statement: Fiber optics let sensitive spectrometers sit away from vibration and dust at the process point.
  effect: guidance
  when: {}
  target: {property: remote_spectrometer}
  sources:
    - {doc: S01, page: 15, quote: "located safely away from the vibration and dust of the manufacturing floor."}

# ---------------------------------------------------------------- calibration / combinations
- id: R-CAL-1
  statement: NIR and Raman calibrations are specific to the matrix; after a change of sample matrix or composition the calibration must be re-validated (and usually rebuilt or extended) on the new material.
  effect: warn
  when: {method: [NIR, Raman]}
  target: {risk: matrix_specific_calibration}
  sources:
    - {doc: REF, page: 5, quote: "Weak signal, fluorescence background; calibration specific to the matrix."}
    - {doc: REF, page: 5, quote: "physical variation; calibration specific to the matrix."}

- id: R-CMB-1
  statement: Combining methods can help for complex samples, but a gain is a hypothesis; compare with the best single method and align sampling location and timing.
  effect: guidance
  when: {}
  target: {claim: method_gain}
  sources:
    - {doc: REF, page: 5, quote: "compare with the best single method."}
    - {doc: REF, page: 5, quote: "Sampling location and timing must be aligned; a gain is a hypothesis to test."}

- id: R-CMB-2
  statement: For heterogeneous samples, different methods must sample the same small area; alternating separate probes cannot guarantee this, combined probes can.
  effect: warn
  when: {heterogeneous: "yes"}
  target: {risk: sampling_location}
  sources:
    - {doc: S01, page: 8, quote: "collected from the same small, even pinpoint, area of the sample. This is difficult to achieve by using two probes alternately for measurements."}

- id: R-CMB-3
  statement: Data from several methods must be synchronised to a common time step before fusion.
  effect: warn
  when: {}
  target: {risk: data_synchronisation}
  sources:
    - {doc: S01, page: 8, quote: "data synchronization can be challenging, as the acquisition rates of different spectra can vary greatly-from milliseconds to minutes"}

# ---------------------------------------------------------------- evidence scope
- id: R-EVI-1
  statement: A laboratory or research study cannot be cited as proof of process or clinical readiness.
  effect: scope_limit
  when: {claim: [readiness_process, readiness_clinical]}
  target: {evidence_scope_not: [lab_example, research_study, literature_map, concept, clinical_aspiration, business]}
  sources:
    - {doc: REF, page: 3, quote: "stretched beyond their scope, for example a laboratory study cited as proof of process or clinical readiness."}

- id: R-EVI-2
  statement: A published application is a reason to test a method, not proof that it will work for a new customer.
  effect: scope_limit
  when: {claim: [performance_figure, readiness_process, readiness_clinical, method_gain]}
  target: {evidence_role: reason_to_test}
  sources:
    - {doc: REF, page: 3, quote: "a published application is a reason to test a method, not proof that it will work for a new customer."}

- id: R-EVI-3
  statement: Spectra of frozen/thawed (ex vivo) samples can differ from in vivo measurements. The source notes model transfer was shown in other work (Raman), but there is no in vivo evidence for the sensor studied; ex vivo results do not establish in vivo use.
  effect: scope_limit
  when: {claim: readiness_clinical}
  target: {evidence_role: ex_vivo_limit}
  sources:
    - {doc: S03, page: 3, quote: "Although the spectra of frozen/thawed biopsies can differ from real-life in vivo measurements, the possibility to transfer the diagnostic model was shown in a previous work on Raman spectroscopy of cancer [28]."}

- id: R-EVI-4
  statement: The bioprocess variable map (Fig. 7) lists literature-reported accessible variables, not demonstrated AFS capability.
  effect: scope_limit
  when: {evidence_scope: literature_map}
  target: {evidence_role: literature_only}
  sources:
    - {doc: S01, page: 17, quote: "Fig. 7. Spectral range for bioprocess monitoring with accessible variables."}
    - {doc: S01, page: 17, quote: "Biechele, P., et al. (2015). Sensor systems for bioprocess monitoring."}

# ---------------------------------------------------------------- added after Phase 1 review
- id: R-GEN-1
  statement: A nominal method range is not the range of a specific instrument, fiber or probe; state only the usable range of the selected configuration.
  effect: guidance
  when: {}
  target: {range: nominal_vs_usable}
  sources:
    - {doc: REF, page: 3, quote: "A nominal method range is not the range of a specific instrument, fiber or probe."}
    - {doc: REF, page: 5, quote: "It is not a product specification: actual spectral coverage, fiber length, component ratings, detection limits and accuracy depend on the configuration and the sample."}

- id: R-GEN-2
  statement: A feasibility plan needs representative samples or process states, independent reference measurements, a defined comparison and a go/no-go basis.
  effect: guidance
  when: {}
  target: {plan: feasibility_elements}
  sources:
    - {doc: REF, page: 3, quote: "Representative samples or process states, independent reference measurements, what is compared, and the basis for the go / no-go decision."}

- id: R-GEN-3
  statement: Water absorbs much more strongly in infrared methods than in Raman; for aqueous samples IR measurements need very short paths (ATR), while Raman tolerates water.
  effect: warn
  when: {aqueous: "yes", method: [MIR, NIR]}
  target: {risk: water_absorption}
  sources:
    - {doc: S01, page: 16, quote: "low absorbance for water molecules compared to infrared methods."}
    - {doc: S01, page: 5, quote: "strong absorption in the mid-IR region limits the corresponding spectral method to the analysis of very thin samples"}

- id: R-GEN-4
  statement: In NIR transmission the optical pathlength must be controlled (usually 1-10 mm in the dairy example); too wide loses signal to absorption, too narrow samples a negligible volume.
  effect: warn
  when: {method: NIR, technique: transmission}
  target: {risk: pathlength_control}
  sources:
    - {doc: S01, page: 18, quote: "the precise control of the optical pathlength (usually 1 - 10 mm); if the pathlength is too wide, the signal is lost to absorption; if too narrow, the sample represents a negligible volume."}

- id: R-GEN-5
  statement: Sample inhomogeneity and process turbulence must be considered when choosing the measurement technique and sampling location.
  effect: warn
  when: {heterogeneous: "yes"}
  target: {risk: inhomogeneity}
  sources:
    - {doc: S01, page: 7, quote: "Morphological factors, such as sample inhomogeneity (e.g., biological tissue) or process turbulence, must also be considered when selecting a measurement technique."}

# ---------------------------------------------------------------- procedure
- id: R-PRO-1
  statement: When the sample composition or target is not well known, start with multi-method laboratory trials on representative samples to select the method.
  effect: guidance
  when: {}
  target: {plan: multi_method_screening}
  sources:
    - {doc: S01, page: 3, quote: "samples of incompletely known composition, in order to select the most suitable method or combination of methods."}
    - {doc: S02, page: 20, quote: "1. Multi-Method Lab Trials AFS tests your process using all key fiber optic spectroscopy methods."}

- id: R-PRO-2
  statement: 'An "insufficient information" status is a valid outcome; ask the deciding questions and propose the next step instead of guessing.'
  effect: guidance
  when: {}
  target: {status: insufficient_information}
  sources:
    - {doc: REF, page: 3, quote: "If the known facts cannot justify a method choice, say so, ask the questions that would decide it and propose the next step."}

- id: R-PRO-3
  statement: Never invent spectra, results, accuracy, detection limits, response times, fiber lengths or other performance figures, client facts, product codes or prices.
  effect: guidance
  when: {}
  target: {claim: performance_figure}
  sources:
    - {doc: REF, page: 3, quote: "Do not invent measured spectra or experimental results; accuracy, detection limits, response times, fiber lengths or other performance figures that no source supports"}
