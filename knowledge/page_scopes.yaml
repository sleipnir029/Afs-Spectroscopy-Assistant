# Evidence scope per source page (our own annotation, 2026-10-17).
# Tags:
#   method              general description of a method, technique or principle
#   concept             system concept / vision (what a lab or system *can* do), no data
#   component_spec      fiber, probe or component properties
#   lab_example         laboratory application example or lab data
#   process_example     industrial / in-line process application example
#   literature_map      summary of literature-reported capabilities, not AFS-demonstrated
#   research_study      peer-reviewed research study (state its sample size / setting)
#   clinical_aspiration clinical use described as a goal or vision, not validated
#   business            company, market or contact information; not technical evidence
#   guidance            organizer guidance compiled from the sources (REF)
# A page can carry several tags. `note` says why, in our words.

