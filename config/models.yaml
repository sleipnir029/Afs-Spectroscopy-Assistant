# Model roles for the pipeline (OpenRouter ids, pinned; no ~latest aliases).
# Production config since D-063 (2026-10-18 11:46, user decision after the 5.8 bake-off): the combined arm "mix-a"
# (docs/model-research.md §9; outputs/bakeoff-dev/blind/summary.md): Gemini 3.5 Flash-Lite for the short structured
# jobs (intake, external), GLM-5.3-Flash writes the assessment, Gemini 3.8 Flash repairs failed checks (escalating
# repair), and every role retries a discarded or timed-out reply on another model (fallback_model, D-059).
# Previous config (deepseek-v4.1-flash for every role): config/bakeoff/baseline-v4.1-flash.yaml.
# Other settings: model_params.<model>.omit drops request params a model does not accept (D-054); the env var
# AFS_MODELS_CONFIG points at another config (bake-off arms); timeouts per role (D-038/D-040).
provider: openrouter
base_url: https://openrouter.ai/api/v1
temperature: 0
response_mode: json_schema
timeout_s: 600
roles:
  intake: {model: google/gemini-3.5-flash-lite, fallback_model: z-ai/glm-5.3-flash, max_tokens: 16000, reasoning: {effort: medium}, timeout_s: 240}
  assess: {model: z-ai/glm-5.3-flash, fallback_model: google/gemini-3.8-flash, max_tokens: 64000, reasoning: {effort: medium}, timeout_s: 600}
  repair: {model: google/gemini-3.8-flash, fallback_model: z-ai/glm-5.3-flash, max_tokens: 64000, reasoning: {effort: medium}, timeout_s: 600}
  external_queries: {model: google/gemini-3.5-flash-lite, fallback_model: z-ai/glm-5.3-flash, max_tokens: 16000, reasoning: {effort: low}, timeout_s: 180}
  external_evidence: {model: google/gemini-3.5-flash-lite, fallback_model: z-ai/glm-5.3-flash, max_tokens: 32000, reasoning: {effort: low}, timeout_s: 180}
  chat_answer: {model: z-ai/glm-5.3-flash, fallback_model: google/gemini-3.8-flash, max_tokens: 16000, reasoning: {effort: low}, timeout_s: 120}
# `only` lists are load-bearing (strict structured output). GLM: Baseten first here (faster than StreamLake in the
# single-model arm, ~45 tok/s measured there); Gemini: flex tier only.
provider_routing:
  z-ai/glm-5.3-flash: {order: [baseten/fp8, inceptron/fp8, near-ai/fp8, streamlake/fp8, morph/fp8], only: [baseten/fp8, inceptron/fp8, near-ai/fp8, streamlake/fp8, morph/fp8], allow_fallbacks: true}
  google/gemini-3.5-flash-lite: {order: [google-ai-studio/flex, google-vertex/global/flex], only: [google-ai-studio/flex, google-vertex/global/flex], allow_fallbacks: true}
  google/gemini-3.8-flash: {order: [google-ai-studio/flex, google-vertex/global/flex], only: [google-ai-studio/flex, google-vertex/global/flex], allow_fallbacks: true}
prices:
  z-ai/glm-5.3-flash: {input: 0.15, output: 0.69}
  google/gemini-3.5-flash-lite: {input: 0.15, output: 1.25}
  google/gemini-3.8-flash: {input: 0.375, output: 1.875}
spend_cap_usd:
  per_run: 1.00
  per_session: 10.00
