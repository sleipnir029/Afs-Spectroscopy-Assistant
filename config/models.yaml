# Model roles for the pipeline (OpenRouter ids, pinned; no ~latest aliases).
# Phase 2 dev model chosen by the user (v4.1-flash since D-011, for cost); the final model is decided in the Phase 3 bake-off.
provider: openrouter
base_url: https://openrouter.ai/api/v1
temperature: 0
# json_schema = strict structured output (preferred); json_object = fallback with pydantic validation.
response_mode: json_schema
# max_tokens includes the hidden reasoning tokens of v4.1-flash (about 5k on a short intake; up to ~28k on a hard
# assess, which cut a reply at 32k, D-025). Routed endpoints allow >=131k output tokens (checked 2026-10-17 15:10).
# Timeouts (D-038): the SDK client is built with max_retries=0 and the client-wide `timeout_s` below; every
# request passes its role's `timeout_s` (seconds; a role without one uses the top-level value). A timed-out
# request is retried once, then the call fails (RuntimeError; a set run records the case as failed and goes on).
# Other transient errors (connection, rate limit, 5xx) keep up to 3 attempts. Values set by the user (D-040).
timeout_s: 600
roles:
  intake: {model: deepseek/deepseek-v4.1-flash, max_tokens: 16000, timeout_s: 240}
  assess: {model: deepseek/deepseek-v4.1-flash, max_tokens: 64000, timeout_s: 600}
  repair: {model: deepseek/deepseek-v4.1-flash, max_tokens: 64000, timeout_s: 600}
  # Phase 4 external evidence (gap-gated): a small query plan and one secondary-evidence call.
  external_queries: {model: deepseek/deepseek-v4.1-flash, max_tokens: 16000, reasoning: {effort: low}, timeout_s: 180}
  external_evidence: {model: deepseek/deepseek-v4.1-flash, max_tokens: 32000, reasoning: {effort: low}, timeout_s: 180}
  # 5.12 chat: one answer call per follow-up question (and at most one repair call), same model as assess.
  chat_answer: {model: deepseek/deepseek-v4.1-flash, max_tokens: 16000, reasoning: {effort: low}, timeout_s: 120}
# Provider routing per model: only strict-JSON capable, non-fp4 endpoints, cheapest first (checked 2026-10-17 10:14).
provider_routing:
  deepseek/deepseek-v4.1-flash: {order: [deepinfra, atlas-cloud, coreweave], only: [deepinfra, atlas-cloud, coreweave], allow_fallbacks: true}
# Optional per-model request params (D-054): `model_params: {<model>: {omit: [temperature]}}` leaves `temperature`
# out of the request for a model that does not accept it. Env var AFS_MODELS_CONFIG selects another models config
# (e.g. config/bakeoff/<arm>.yaml); each run's manifest records the path and sha256 of the one used.
# Fallback prices (USD per 1M tokens) used only if OpenRouter does not return a cost.
prices:
  deepseek/deepseek-v4.1-flash: {input: 0.15, output: 0.60}
spend_cap_usd:
  per_run: 1.00
  per_session: 10.00
