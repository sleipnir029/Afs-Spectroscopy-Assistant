# 5.8 bake-off arm (D-054): anthropic/claude-haiku-5.5. Use with AFS_MODELS_CONFIG=config/bakeoff/claude-haiku-5.5.yaml.
# Same structure, max_tokens, timeouts and spend caps as config/models.yaml; only the role models, reasoning effort,
# routing, model_params and prices differ. Endpoint data: GET .../api/v1/models/anthropic/claude-haiku-5.5/endpoints.
provider: openrouter
base_url: https://openrouter.ai/api/v1
temperature: 0
response_mode: json_schema
timeout_s: 600
roles:
  intake: {model: anthropic/claude-haiku-5.5, max_tokens: 16000, reasoning: {effort: medium}, timeout_s: 240}
  assess: {model: anthropic/claude-haiku-5.5, max_tokens: 64000, reasoning: {effort: medium}, timeout_s: 600}
  repair: {model: anthropic/claude-haiku-5.5, max_tokens: 64000, reasoning: {effort: medium}, timeout_s: 600}
  external_queries: {model: anthropic/claude-haiku-5.5, max_tokens: 16000, reasoning: {effort: low}, timeout_s: 180}
  external_evidence: {model: anthropic/claude-haiku-5.5, max_tokens: 32000, reasoning: {effort: low}, timeout_s: 180}
# No endpoint lists `temperature`, so it is not sent (these runs are not at temperature 0; accepted by the user).
model_params:
  anthropic/claude-haiku-5.5: {omit: [temperature]}
# Routing checked 2026-10-18 09:03 CEST. The `only` list is load-bearing: require_parameters does not exclude endpoints
# that list response_format without strict output (structured_outputs). Kept: Anthropic, Google Vertex (global, europe,
# us) and Azure (global, us), all listing structured_outputs; a base slug matches every region of its provider;
# order = cheapest first (each has a 0.10/0.50 endpoint; the regional ones are 0.11/0.55). Quantization is not
# published for this closed model. Excluded: Amazon Bedrock (all regions) and Claude Platform on AWS (no
# structured_outputs).
provider_routing:
  anthropic/claude-haiku-5.5: {order: [anthropic, google-vertex, azure], only: [anthropic, google-vertex, azure], allow_fallbacks: true}
# Fallback prices (USD per 1M tokens) used only if OpenRouter does not return a cost: the dearest endpoint in the
# `only` list (regional Vertex/Azure).
prices:
  anthropic/claude-haiku-5.5: {input: 0.11, output: 0.55}
spend_cap_usd:
  per_run: 1.00
  per_session: 10.00
